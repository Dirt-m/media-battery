name: android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # :core is pure JVM (the ported extension test suites). Both flavors build so the
      # Play degradation path can't rot.
      - run: ./gradlew --no-daemon :core:test :app:assembleFullDebug :app:assemblePlayDebug
        working-directory: android
