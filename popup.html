<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app" data-state="ok" data-flow="charging" data-sync="off">
    <button class="icon-btn sync" data-role="sync" title="Sync" aria-label="Sync">
      <!-- Cloud when synced, crossed-out cloud when not -->
      <svg class="cloud-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      <svg class="cloud-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    <button class="icon-btn gear" data-role="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>

    <div class="clock">
      <div class="time" data-role="time">--:--</div>
      <div class="time-label" data-role="time-label">charge left</div>
    </div>

    <!-- Battery: the fill is the charge, the cap is the nub on the right. A bolt sits
         on top while charging, a down arrow while draining. -->
    <div class="battery">
      <div class="cell">
        <div class="cell-fill" data-role="bar"></div>
        <svg class="flow-ic bolt" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M13 2 4.9 13.4h4.6L8.6 22l8.5-11.4h-4.6L13 2z"/></svg>
        <svg class="flow-ic drain" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 21.5 5.5 14h3.7V3h5.6v11h3.7L12 21.5z"/></svg>
      </div>
      <div class="nub"></div>
    </div>

    <!-- Shown when Firefox holds no host grant for a tracked site: the extension
         cannot inject there, so nothing drains or blocks until access is back. -->
    <div class="access" data-role="access" hidden>
      <span data-role="access-text"></span>
      <button data-role="access-fix">Restore</button>
    </div>
  </div>
  <script src="platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
